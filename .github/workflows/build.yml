name: Build SISHHIN HZ MACHINE VST3

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Collect VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' |
            Where-Object { $_.Name -eq 'SISHHIN HZ MACHINE.vst3' } |
            Select-Object -First 1
          if (-not $vst3) {
            $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          }
          if (-not $vst3) { throw 'No .vst3 bundle was produced' }
          Write-Host "Found VST3: $($vst3.FullName)"
          Copy-Item -Recurse -Force $vst3.FullName dist/
          if (-not (Test-Path 'dist/*.vst3')) { throw 'Collected VST3 bundle is missing' }
          Get-ChildItem -Recurse dist | Select-Object FullName,Length

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SISHHIN-HZ-MACHINE-VST3-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Package release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist/*' -DestinationPath 'SISHHIN-HZ-MACHINE-VST3-Windows-x64.zip' -Force

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: SISHHIN-HZ-MACHINE-VST3-Windows-x64.zip
